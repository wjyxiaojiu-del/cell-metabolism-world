<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#e6f2f5"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#357f8d"/></marker></defs><rect width="1000" height="560" rx="28" fill="url(#bg)"/><text x="40" y="52" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#20586a">核苷酸周转：去磷酸 → 补救回收，或分别降解嘌呤与嘧啶</text><rect x="36" y="92" width="260" height="390" rx="22" fill="#dceef2" stroke="#72aebb" stroke-width="3"/><text x="67" y="128" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#2a6472">细胞质核苷酸池</text><g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#285f6d"><rect x="75" y="170" width="180" height="44" rx="12" fill="#fff"/><text x="105" y="198">AMP / GMP</text><rect x="75" y="232" width="180" height="44" rx="12" fill="#fff"/><text x="105" y="260">UMP / TMP</text><text x="76" y="326" font-size="17">5'-核苷酸酶</text><text x="76" y="355" font-size="17">去磷酸 → 核苷</text><text x="76" y="414" font-size="16" fill="#527982">主要发生在细胞质</text></g><path d="M296 285 H375" stroke="#357f8d" stroke-width="5" marker-end="url(#arr)"/><rect x="380" y="172" width="245" height="220" rx="20" fill="#fff" stroke="#72aebb" stroke-width="3"/><text x="416" y="208" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#2a6472">补救回收</text><rect x="415" y="235" width="175" height="45" rx="12" fill="#d7edf2"/><text x="451" y="264" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#2a6472">碱基 / 核苷</text><path d="M502 282 V320" stroke="#357f8d" stroke-width="4" marker-end="url(#arr)"/><rect x="415" y="326" width="175" height="45" rx="12" fill="#c5e4ed"/><text x="451" y="355" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#2a6472">PRPP → NMP</text><path d="M625 280 H700" stroke="#357f8d" stroke-width="5" marker-end="url(#arr)"/><rect x="705" y="92" width="255" height="165" rx="20" fill="#f5dfc7" stroke="#c58a51" stroke-width="3"/><text x="736" y="128" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#80572f">嘌呤降解</text><text x="740" y="174" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#8c6746">次黄嘌呤 / 黄嘌呤</text><path d="M832 190 V218" stroke="#b8783f" stroke-width="4" marker-end="url(#arr)"/><text x="802" y="244" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" fill="#80572f">尿酸</text><rect x="705" y="300" width="255" height="182" rx="20" fill="#e6e0f3" stroke="#9b8bc3" stroke-width="3"/><text x="736" y="336" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#625489">嘧啶降解</text><text x="735" y="378" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#71639a">尿嘧啶 → β-丙氨酸</text><text x="735" y="416" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#71639a">胸腺嘧啶 → β-氨基异丁酸</text><text x="40" y="526" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#52727b">先处理核苷酸池，再优先补救；人类嘌呤终产物为尿酸，嘧啶进入可溶性小分子代谢。</text></svg>
