<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fcfd"/><stop offset="1" stop-color="#e7f3f5"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#347f8d"/></marker></defs><rect width="1000" height="560" rx="28" fill="url(#bg)"/><text x="40" y="52" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#20586a">氨基酸碳骨架：去氮后进入丙酮酸、乙酰-CoA 或 TCA</text><circle cx="500" cy="292" r="106" fill="#fff" stroke="#5d9eac" stroke-width="4"/><text x="440" y="284" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#2d6a78">TCA 循环</text><text x="449" y="316" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#54747b">补充反应 / 氧化</text><path d="M420 240 A112 112 0 1 0 579 239" fill="none" stroke="#5d9eac" stroke-width="5" marker-end="url(#arr)"/><g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18"><rect x="42" y="108" width="210" height="70" rx="16" fill="#d7edf2"/><text x="68" y="137" fill="#2b6674">丙氨酸、丝氨酸</text><text x="77" y="162" fill="#527982">→ 丙酮酸</text><path d="M252 143 C330 160 358 196 403 230" fill="none" stroke="#347f8d" stroke-width="4" marker-end="url(#arr)"/><rect x="42" y="390" width="210" height="70" rx="16" fill="#d7edf2"/><text x="64" y="419" fill="#2b6674">天冬氨酸、天冬酰胺</text><text x="86" y="444" fill="#527982">→ 草酰乙酸</text><path d="M252 425 C335 411 365 370 406 345" fill="none" stroke="#347f8d" stroke-width="4" marker-end="url(#arr)"/><rect x="745" y="108" width="210" height="70" rx="16" fill="#f5dfc7"/><text x="773" y="137" fill="#8a5a32">亮氨酸、赖氨酸</text><text x="789" y="162" fill="#966d48">→ 乙酰-CoA</text><path d="M745 143 C685 160 650 195 600 230" fill="none" stroke="#b77a45" stroke-width="4" marker-end="url(#arr)"/><rect x="745" y="390" width="210" height="70" rx="16" fill="#f5dfc7"/><text x="768" y="419" fill="#8a5a32">苯丙氨酸、酪氨酸</text><text x="775" y="444" fill="#966d48">→ 延胡索酸</text><path d="M745 425 C680 411 643 375 597 345" fill="none" stroke="#b77a45" stroke-width="4" marker-end="url(#arr)"/><rect x="365" y="96" width="270" height="52" rx="14" fill="#e4dff2"/><text x="395" y="129" fill="#62558b">异亮氨酸、缬氨酸 → 琥珀酰-CoA</text><path d="M500 148 V183" stroke="#7560a8" stroke-width="4" marker-end="url(#arr)"/><rect x="360" y="440" width="280" height="52" rx="14" fill="#e4dff2"/><text x="390" y="473" fill="#62558b">谷氨酸 → α-酮戊二酸（转氨）</text><path d="M500 440 V401" stroke="#7560a8" stroke-width="4" marker-end="url(#arr)"/><text x="40" y="520" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#52727b">分类要点：生糖型进入丙酮酸/TCA；生酮型进入乙酰-CoA或乙酰乙酰-CoA；部分氨基酸兼具两者去路。</text></svg>
