<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Plant cell overview</title>
  <desc id="desc">A clean plant cell cross-section with cell wall, plasma membrane, central vacuole, chloroplasts, nucleus, mitochondria, endoplasmic reticulum, Golgi apparatus, and glyoxysomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f5"/>
      <stop offset="0.56" stop-color="#f8f9e9"/>
      <stop offset="1" stop-color="#e8f2ee"/>
    </linearGradient>
    <linearGradient id="cytosol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5ce"/>
      <stop offset="1" stop-color="#e4efd0"/>
    </linearGradient>
    <linearGradient id="vacuole" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f4fb"/>
      <stop offset="0.55" stop-color="#bfe8f3"/>
      <stop offset="1" stop-color="#d9f2ed"/>
    </linearGradient>
    <linearGradient id="chloroplastFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9dc71"/>
      <stop offset="1" stop-color="#5b9d64"/>
    </linearGradient>
    <linearGradient id="nucleusFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c6e7"/>
      <stop offset="1" stop-color="#927cb6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#315f56" flood-opacity=".16"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#244e49" flood-opacity=".14"/>
    </filter>
    <pattern id="wallTexture" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 15h30M15 0v30" stroke="#6eaa5d" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
    <g id="chloroplast">
      <ellipse cx="0" cy="0" rx="142" ry="78" fill="url(#chloroplastFill)" stroke="#3e7851" stroke-width="7"/>
      <ellipse cx="0" cy="0" rx="128" ry="65" fill="none" stroke="#dceeb2" stroke-width="5" opacity=".8"/>
      <g fill="#397c50" opacity=".86">
        <rect x="-88" y="-38" width="32" height="76" rx="13"/>
        <rect x="-40" y="-44" width="32" height="88" rx="13"/>
        <rect x="8" y="-40" width="32" height="80" rx="13"/>
        <rect x="56" y="-34" width="32" height="68" rx="13"/>
      </g>
      <g stroke="#badd87" stroke-width="4" opacity=".8">
        <path d="M-72-48v96M-24-54v108M24-50v100M72-44v88"/>
      </g>
      <ellipse cx="98" cy="16" rx="15" ry="23" fill="#e9e0a9" opacity=".9"/>
    </g>
    <g id="mitochondrion">
      <ellipse cx="0" cy="0" rx="112" ry="58" fill="#df8064" stroke="#a74f46" stroke-width="7"/>
      <path d="M-87-8c20-42 44 42 66 0s45 42 67 0 42 32 62 0" fill="none" stroke="#f5c4a6" stroke-width="11" stroke-linecap="round"/>
      <path d="M-82 21c20-31 39 25 58 0s40 28 60 0 38 22 56 0" fill="none" stroke="#f7d4bd" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity=".24" fill="#4b9181">
    <circle cx="150" cy="170" r="4"/><circle cx="1420" cy="140" r="5"/><circle cx="1510" cy="510" r="4"/>
    <circle cx="210" cy="850" r="6"/><circle cx="920" cy="90" r="4"/><circle cx="1380" cy="890" r="5"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="68" y="76" width="1464" height="848" rx="238" fill="url(#cytosol)" stroke="#79ac63" stroke-width="44"/>
    <rect x="68" y="76" width="1464" height="848" rx="238" fill="url(#wallTexture)" stroke="#4f8d5e" stroke-width="4" opacity=".75"/>
    <rect x="108" y="116" width="1384" height="768" rx="201" fill="none" stroke="#2f7e6a" stroke-width="8"/>
    <rect x="121" y="129" width="1358" height="742" rx="190" fill="none" stroke="#d4e9a5" stroke-width="5"/>
  </g>

  <g filter="url(#soft)">
    <rect x="500" y="196" width="770" height="574" rx="205" fill="url(#vacuole)" stroke="#65aab8" stroke-width="10"/>
    <rect x="515" y="211" width="740" height="544" rx="190" fill="none" stroke="#f4ffff" stroke-width="5" opacity=".9"/>
    <path d="M615 278c150-82 363-73 532 6" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" opacity=".3"/>
    <g fill="#fff" opacity=".4"><circle cx="720" cy="550" r="10"/><circle cx="1070" cy="372" r="7"/><circle cx="905" cy="680" r="12"/></g>
  </g>

  <g filter="url(#soft)">
    <circle cx="330" cy="468" r="132" fill="url(#nucleusFill)" stroke="#675a91" stroke-width="9"/>
    <circle cx="330" cy="468" r="116" fill="none" stroke="#eee5f4" stroke-width="5" opacity=".9"/>
    <circle cx="300" cy="445" r="43" fill="#7b5d9d" opacity=".92"/>
    <g fill="#f5edf8" opacity=".7"><circle cx="369" cy="418" r="8"/><circle cx="385" cy="493" r="6"/><circle cx="277" cy="526" r="7"/></g>
    <g fill="#4f776b"><circle cx="330" cy="334" r="7"/><circle cx="428" cy="388" r="7"/><circle cx="447" cy="486" r="7"/><circle cx="245" cy="367" r="7"/></g>
  </g>

  <g fill="none" stroke="#568ab0" stroke-width="14" stroke-linecap="round" opacity=".8">
    <path d="M195 360c65-52 120-42 172-5"/>
    <path d="M180 392c72-45 135-31 179 5"/>
    <path d="M201 580c68 38 132 34 188-4"/>
    <path d="M220 614c71 30 139 20 187-22"/>
  </g>
  <g fill="#3d6f91"><circle cx="208" cy="352" r="6"/><circle cx="246" cy="336" r="6"/><circle cx="292" cy="335" r="6"/><circle cx="211" cy="586" r="6"/><circle cx="260" cy="602" r="6"/></g>

  <g filter="url(#soft)">
    <use href="#chloroplast" transform="translate(485 205) rotate(-13) scale(.92)"/>
    <use href="#chloroplast" transform="translate(1300 225) rotate(17) scale(.82)"/>
    <use href="#chloroplast" transform="translate(1310 735) rotate(-14) scale(.76)"/>
    <use href="#mitochondrion" transform="translate(275 748) rotate(18) scale(.9)"/>
    <use href="#mitochondrion" transform="translate(1360 500) rotate(-24) scale(.74)"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="485" cy="770" r="75" fill="#e5bd67" stroke="#a77b35" stroke-width="8"/>
    <circle cx="485" cy="770" r="59" fill="#f4d98f" stroke="#fff0bc" stroke-width="4"/>
    <path d="M450 777c18-42 42 31 69-15s38 22 51-2" fill="none" stroke="#b78339" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1138" cy="787" r="54" fill="#9cc977" stroke="#568451" stroke-width="7"/>
    <path d="M1110 786l18-23 22 22 20-28" fill="none" stroke="#e5f0c8" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g filter="url(#soft)" fill="none" stroke="#cf6f82" stroke-width="16" stroke-linecap="round">
    <path d="M344 700c45-35 93-29 130 7"/>
    <path d="M326 729c58-39 116-29 157 10"/>
    <path d="M318 759c61-34 126-23 169 18"/>
  </g>
  <g fill="#dfa6b1" filter="url(#soft)"><circle cx="512" cy="703" r="20"/><circle cx="530" cy="754" r="16"/></g>

  <g opacity=".42" fill="none" stroke="#6c9f73" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 12">
    <path d="M590 282c-96 70-112 210-51 315"/>
    <path d="M1253 310c71 77 84 196 31 284"/>
    <path d="M562 760c146 79 333 100 491 51"/>
  </g>
</svg>
