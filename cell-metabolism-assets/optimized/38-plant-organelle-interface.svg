<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Plant plastid and glyoxysome metabolic interface</title>
  <desc id="desc">A plant cytosol close view showing a chloroplast, glyoxysome, and mitochondrion linked by metabolite exchange.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f8f3"/><stop offset=".55" stop-color="#e7f1de"/><stop offset="1" stop-color="#edf5f7"/></linearGradient>
    <linearGradient id="plastid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bddd76"/><stop offset="1" stop-color="#4e9c63"/></linearGradient>
    <linearGradient id="glyoxy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6dda0"/><stop offset="1" stop-color="#d9a94f"/></linearGradient>
    <linearGradient id="mito" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eca081"/><stop offset="1" stop-color="#c45c52"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#254f49" flood-opacity=".16"/></filter>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#43856b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowAmber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#bd8435" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <path d="M0 176c283 52 469-49 731-18 298 35 494 4 869-40v762c-323-27-534 40-808 10-318-36-516 27-792-18z" fill="#f8f5d8" opacity=".72"/>
