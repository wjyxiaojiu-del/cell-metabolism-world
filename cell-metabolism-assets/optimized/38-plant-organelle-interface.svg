    <ellipse cx="650" cy="535" rx="62" ry="86" fill="#efe4b3" stroke="#bfa95f" stroke-width="8" opacity=".95"/>
    <g fill="#d1bf78" opacity=".65"><circle cx="620" cy="505" r="9"/><circle cx="660" cy="565" r="12"/><circle cx="681" cy="500" r="7"/></g>
  </g>

