server {
    listen 80;
    listen [::]:80;
    server_name cell.xiaojiu.pw;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cell.xiaojiu.pw;

    ssl_certificate /etc/nginx/ssl/cell.xiaojiu.pw/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cell.xiaojiu.pw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /var/www/cell.xiaojiu.pw/current;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
